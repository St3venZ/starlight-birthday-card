<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050712" />
    <meta name="description" content="把珍藏的回忆，折进一张纯白立体 3D 生日贺卡，支持在线上传照片与生成专属短链分享。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://starlight-birthday-card.top/" />
    <meta property="og:title" content="Starlight 3D 生日贺卡" />
    <meta property="og:description" content="纯白棉纸质感 3D 交互式生日贺卡，支持自定义年龄数字照片墙、180° 翻面悄悄话与专属短链分享。" />
    <link rel="canonical" href="https://starlight-birthday-card.top/" />
    <title>生日快乐 - 3D 交互生日贺卡</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF8F4'/%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='none' stroke='%23C59B5F' stroke-opacity='0.65' stroke-width='1.5'/%3E%3Cpath d='M32 16 L35.2 28.8 L48 32 L35.2 35.2 L32 48 L28.8 35.2 L16 32 L28.8 28.8 Z' fill='%23C59B5F'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050712;
        color: #f6f3ed;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #050712;
      }

      #canvas-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #ui-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }

      #boot-veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050712;
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #boot-veil.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f3d38c;
        box-shadow: 0 0 20px rgba(243, 211, 140, 0.55);
        animation: bootPulse 1.5s ease-in-out infinite;
      }

      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.38;
          transform: scale(0.86);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.16);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>
      <div id="ui-root"></div>
    </div>
    <div id="boot-veil" aria-hidden="true">
      <span class="boot-dot"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
